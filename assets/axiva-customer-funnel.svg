<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="t d"><title id="t">Axiva customer journey — from personalised intake to dashboard</title><desc id="d">Six-stage Axiva funnel: personalised intake, photo upload, AI analysis, quick wins and score, upgrade to full report, and personal dashboard.</desc><rect width="1200" height="940" rx="24" fill="#102331"/><g font-family="Arial,Helvetica,sans-serif"><text x="72" y="61" fill="#77D7CD" font-size="16" letter-spacing="3">AXIVA / PRODUCT &amp; CONVERSION DESIGN</text><text x="72" y="106" fill="#FFFFFF" font-size="36" font-weight="700">A journey built around progressive value</text><text x="72" y="140" fill="#C5D6DD" font-size="18">Build trust and context first. Deliver a useful result. Invite users to go deeper.</text><rect x="72" y="180" width="1056" height="94" rx="16" fill="#EDF5F5" stroke="#BCD8DE" stroke-width="1.5"/><circle cx="123" cy="227" r="26" fill="#CCEBE7"/><path d="M600 274 V293" stroke="#569FA7" stroke-width="3"/><path d="M593 286 L600 295 L607 286" fill="none" stroke="#569FA7" stroke-width="3"/><rect x="72" y="295" width="1056" height="94" rx="16" fill="#EDF5F5" stroke="#BCD8DE" stroke-width="1.5"/><circle cx="123" cy="342" r="26" fill="#CCEBE7"/><path d="M600 389 V408" stroke="#569FA7" stroke-width="3"/><path d="M593 401 L600 410 L607 401" fill="none" stroke="#569FA7" stroke-width="3"/><rect x="72" y="410" width="1056" height="94" rx="16" fill="#EDF5F5" stroke="#BCD8DE" stroke-width="1.5"/><circle cx="123" cy="457" r="26" fill="#CCEBE7"/><path d="M600 504 V523" stroke="#569FA7" stroke-width="3"/><path d="M593 516 L600 525 L607 516" fill="none" stroke="#569FA7" stroke-width="3"/><rect x="72" y="525" width="1056" height="94" rx="16" fill="#193B51" stroke="#193B51" stroke-width="1.5"/><circle cx="123" cy="572" r="26" fill="#80DBCD"/><path d="M600 619 V638" stroke="#569FA7" stroke-width="3"/><path d="M593 631 L600 640 L607 631" fill="none" strok