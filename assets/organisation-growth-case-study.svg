<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc"><title id="title">Organisational development for the next stage of growth</title><desc id="desc">An organisational development project planning for growth from 80 to 220 employees over 12 months, with six connected workstreams: organisation design, workforce plan, talent and employer brand, learning and leadership, culture and benefits, financial and operational controls. 220 is a scale objective, not an achieved headcount claim.</desc><rect width="1200" height="730" rx="20" fill="#142235"/><rect x="48" y="47" width="1104" height="1" fill="#71869A"/><g font-family="Arial,Helvetica,sans-serif"><text x="50" y="34" fill="#9BB6D3" font-size="16" letter-spacing="3">ORGANISATIONAL DEVELOPMENT / FUNCTIONAL TRANSFORMATION</text><text x="50" y="110" fill="#F2F7FD" font-size="38" font-weight="bold">Building the organisation behind growth</text><text x="50" y="145" fill="#B7C9DB" font-size="18">A workforce plan that connects people, culture, structure and cost</text><rect x="50" y="184" width="514" height="126" rx="10" fill="#24374C"/><rect x="584" y="184" width="566" height="126" rx="10" fill="#24374C"/><text x="75" y="218" font-size="16" fill="#BCD2E3">STARTING HEADCOUNT</text><text x="75" y="280" font-size="64" fill="#FFFFFF" font-weight="bold">80</text><text x="609" y="218" font-size="16" fill="#BCD2E3">PLANNED 12-MONTH CAPACITY</text><text x="609" y="280" font-size="64" fill="#A2D7D3" font-weight="bold">220</text><text x="830" y="280" font-size="20" fill="#E0ECEF">2.75× planned scale</text><text x="50" y="353" font-size="16" letter-spacing="2" fill="#9BB6D3">CONNECTED WORKSTREAMS</text></g><rect x="50" y="378" width="348" height="106" rx="9" fill="#1D3044" stroke="#446078"/><text x="69" y="408" font-family="Arial,sans-serif" fill="#8FCFC9" font-size="15">01</text><text x="69" y="435" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#F3F8FC">ORG DESIGN</text><text x="69" y="460" font-family="Arial,sans-serif" font-size="15" fill="#B3C6D6">Structure, roles, reporting</text><rect x="421" y="378" width="348" height="106" rx="9" fill="#1D3044" stroke="#446078"/><text x="440" y="408" font-family="Arial,sans-serif" fill="#8FCFC9" font-size="15">02</text><text x="440" y="435" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#F3F8FC">WORKFORCE PLANNING</text><text x="440" y="460" font-family="Arial,sans-serif" font-size="15" fill="#B3C6D6">Phasing and capacity</text><rect x="792" y="378" width="348" height="106" rx="9" fill="#1D3044" stroke="#446078"/><text x="811" y="408" font-family="Arial,sans-serif" fill="#8FCFC9" font-size="15">03</text><text x="811" y="435" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#F3F8FC">TALENT + EMPLOYER BRAND</text><text x="811" y="460" font-family="Arial,sans-serif" font-size="15" fill="#B3C6D6">Hiring principles and EVP</text><rect x="50" y="504" width="348" height="106" rx="9" fill="#1D3044" stroke="#446078"/><text x="69" y="534" font-family="Arial,sans-serif" fill="#8FCFC9" font-size="15">04</text><text x="69" y="561" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#F3F8FC">LEARNING + LEADERSHIP</text><text x="69" y="586" font-family="Arial,sans-serif" font-size="15" fill="#B3C6D6">Managers, capability, L&amp;D</text><rect x="421" y="504" width="348" height="106" rx="9" fill="#1D3044" stroke="#446078"/><text x="440" y="534" font-family="Arial,sans-serif" fill="#8FCFC9" font-size="15">05</text><text x="440" y="561" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#F3F8FC">CULTURE + BENEFITS</text><text x="440" y="586" font-family="Arial,sans-serif" font-size="15" fill="#B3C6D6">Experience through change</text><rect x="792" y="504" width="348" height="106" rx="9" fill="#1D3044" stroke="#446078"/><text x="811" y="534" font-family="Arial,sans-serif" fill="#8FCFC9" font-size="15">06</text><text x="811" y="561" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#F3F8FC">COMMERCIAL CONTROL</text><text x="811" y="586" font-family="Arial,sans-serif" font-size="15" fill="#B3C6D6">Budget and hiring-cost discipline</text><line x1="50" y1="648" x2="1150" y2="648" stroke="#577086"/><text x="50" y="681" fill="#D1DFEA" font-family="Arial,sans-serif" font-size="17">Design principle: grow capability without losing culture, accountability or cost visibility.</text><text x="50" y="705" fill="#8FA4B8" font-family="Arial,sans-serif" font-size="13">Planning objective shown; no final headcount or financial outcome inferred.</text></svg>