<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc"><title id="title">Working with me — DISC and motivators analytics</title><desc id="desc">Beth's Explorer Csd style and seven motivator scores from the January 2026 DISC BASIC plus Motivators assessment. Theoretical 83, Economic 59, Individualistic 45, Power 45, Aesthetic 41, Regulatory 38, Altruistic 36.</desc><rect width="1200" height="860" rx="16" fill="#10151E"/><g font-family="Arial,sans-serif"><text x="68" y="64" font-size="15" letter-spacing="4" fill="#A5BBCD">WORKING WITH ME / ASSESSMENT SNAPSHOT</text><line x1="68" y1="86" x2="1132" y2="86" stroke="#617184"/><text x="68" y="149" font-size="42" fill="#F6F9FC">How I think, work &amp; collaborate</text><text x="68" y="189" font-size="18" fill="#A7B8C9">An analytical view of my working preferences, not a personality label.</text><line x1="68" y1="227" x2="1132" y2="227" stroke="#617184"/><text x="68" y="265" font-size="15" letter-spacing="2" fill="#A9BDD0">DISC STYLE</text><text x="68" y="326" font-size="57" fill="#F3F6FA">Csd</text><text x="230" y="320" font-size="25" fill="#A7C7E8">EXPLORER</text><text x="700" y="264" font-size="15" letter-spacing="2" fill="#A9BDD0">CORE WORKING TENDENCIES</text><text x="700" y="293" font-size="19" fill="#F3F6FA">Creative problem-solving</text><text x="700" y="319" font-size="19" fill="#F3F6FA">Pace + quality + considered decisions</text><line x1="68" y1="343" x2="1132" y2="343" stroke="#617184"/><text x="68" y="351" font-size="0"> </text><text x="68" y="382" fill="#DDE8F0" font-family="Arial,sans-serif" font-size="18">Theoretical</text><rect x="270" y="365" width="400" height="22" rx="3" fill="#253647"/><rect x="270" y="365" width="332" height="22" rx="3" fill="#78A5D4"/><text x="700" y="383" fill="#F2F6FA" font-family="Arial,sans-serif" font-size="18" font-weight="bold">83</text><text x="68" y="427" fill="#DDE8F0" font-family="Arial,sans-serif" font-size="18">Economic</text><rect x="270" y="410" width="400" height="22" rx="3" fill="#253647"/><rect x="270" y="410" width="236" height="22" rx="3" fill="#6485A9"/><text x="700" y="428" fill="#F2F6FA" font-family="Arial,sans-serif" font-size="18" font-weight="bold">59</text><text x="68" y="472" fill="#DDE8F0" font-family="Arial,sans-serif" font-size="18">Individualistic</text><rect x="270" y="455" width="400" height="22" rx="3" fill="#253647"/><rect x="270" y="455" width="180" height="22" rx="3" fill="#6485A9"/><text x="700" y="473" fill="#F2F6FA" font-family="Arial,sans-serif" font-size="18" font-weight="bold">45</text><text x="68" y="517" fill="#DDE8F0" font-family="Arial,sans-serif" font-size="18">Power</text><rect x="270" y="500" width="400" height="22" rx="3" fill="#253647"/><rect x="270" y="500" width="180" height="22" rx="3" fill="#6485A9"/><text x="700" y="518" fill="#F2F6FA" font-family="Arial,sans-serif" font-size="18" font-weight="bold">45</text><text x="68" y="562" fill="#DDE8F0" font-family="Arial,sans-serif" font-size="18">Aesthetic</text><rect x="270" y="545" width="400" height="22" rx="3" fill="#253647"/><rect x="270" y="545" width="164" height="22" rx="3" fill="#6485A9"/><text x="700" y="563" fill="#F2F6FA" font-family="Arial,sans-serif" font-size="18" font-weight="bold">41</text><text x="68" y="607" fill="#DDE8F0" font-family="Arial,sans-serif" font-size="18">Regulatory</text><rect x="270" y="590" width="400" height="22" rx="3" fill="#253647"/><rect x="270" y="590" width="152" height="22" rx="3" fill="#6485A9"/><text x="700" y="608" fill="#F2F6FA" font-family="Arial,sans-serif" font-size="18" font-weight="bold">38</text><text x="68" y="652" fill="#DDE8F0" font-family="Arial,sans-serif" font-size="18">Altruistic</text><rect x="270" y="635" width="400" height="22" rx="3" fill="#253647"/><rect x="270" y="635" width="144" height="22" rx="3" fill="#6485A9"/><text x="700" y="653" fill="#F2F6FA" font-family="Arial,sans-serif" font-size="18" font-weight="bold">36</text><line x1="770" y1="351" x2="770" y2="685" stroke="#617184"/><text x="811" y="380" font-size="15" letter-spacing="2" fill="#A9BDD0">STRONGEST DRIVER</text><text x="811" y="431" font-size="44" fill="#A7C7E8">83 / 100</text><text x="811" y="465" font-size="22" fill="#F3F6FA">Theoretical</text><text x="811" y="505" font-size="18" fill="#CEDAE4">Learning, investigation,</text><text x="811" y="532" font-size="18" fill="#CEDAE4">evidence and understanding.</text><text x="811" y="597" font-size="15" letter-spacing="2" fill="#A9BDD0">WHAT THAT MEANS</text><text x="811" y="629" font-size="17" fill="#E0EAF2">I enjoy unfamiliar, complex</text><text x="811" y="655" font-size="17" fill="#E0EAF2">problems and go deep to</text><text x="811" y="681" font-size="17" fill="#E0EAF2">understand how things work.</text><line x1="68" y1="709" x2="1132" y2="709" stroke="#617184"/><text x="68" y="754" font-size="18" fill="#F3F6FA" font-weight="bold">In practice:</text><text x="191" y="754" font-size="18" fill="#D6E2EB">give me context, a meaningful challenge, clear outcomes and room to think.</text><text x="68" y="810" font-size="15" fill="#94A9B8">Source: DISC BASIC + Motivators assessment, 21 January 2026. Scores shown are assessment results.</text></g></svg>